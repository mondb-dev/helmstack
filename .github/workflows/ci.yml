name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  lint-commits:
    name: Lint Commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate PR commits
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  build:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        # Covers every workspace (incl. tests) on all OSes — catches type
        # regressions on Linux, where the Electron desktop build is skipped.
        # Workspace imports resolve to sources via `paths` in
        # tsconfig.typecheck.json, so this runs before any build output exists.
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Docs
        # Generated reference regions are current and relative links resolve.
        if: runner.os == 'Linux' && matrix.node-version == 22
        run: |
          npm run docs:test
          npm run docs:check

      - name: Build packages
        run: npm run build:packages

      - name: Build desktop
        run: npm run build
        # Desktop build requires Electron which needs a display on Linux
        if: runner.os != 'Linux'

      - name: Allow Chrome's sandbox (Ubuntu AppArmor userns restriction)
        # Same fix as the daemon-headless job: the stock runner Chrome can hang at
        # launch ("Target.setDiscoverTargets timed out") when unprivileged user
        # namespaces are restricted.
        if: runner.os == 'Linux'
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Run tests
        # Real-Chrome tests (apps/daemon/test/*.integration.test.ts and the
        # daemon contract suite) run wherever the runner image ships Chrome
        # (all three GitHub-hosted images do) and skip cleanly otherwise. The
        # guaranteed-Chrome run is the `daemon-headless` job below.
        run: npm test

  daemon-headless:
    name: Daemon + contract suite (headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Chrome for Testing channel/version for @puppeteer/browsers
      # (e.g. "stable", or pin a build such as "131.0.6778.85").
      CHROME_VERSION: stable
      # Missing Chrome fails the run instead of skipping the real-browser tests.
      CI_REQUIRE_CHROME: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chrome for Testing
        # @puppeteer/browsers is the version pinned in package-lock.json
        # (a puppeteer-core dependency), so --no-install never fetches another.
        run: |
          out="$(npx --no-install @puppeteer/browsers install "chrome@${CHROME_VERSION}" --path "$RUNNER_TEMP/chrome" --format '{{buildId}} {{path}}')"
          echo "$out"
          read -r build chrome_path <<< "$(echo "$out" | tail -n 1)"
          test -x "$chrome_path"
          echo "Installed Chrome for Testing $build at $chrome_path"
          echo "HELMSTACK_CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"

      - name: Allow Chrome's sandbox (Ubuntu 23.10+ AppArmor userns restriction)
        # Chrome for Testing has no setuid sandbox helper; without unprivileged
        # user namespaces it aborts with "No usable sandbox". See
        # https://pptr.dev/troubleshooting#issues-with-apparmor-on-ubuntu
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          "$HELMSTACK_CHROME_PATH" --headless=new --disable-gpu --dump-dom about:blank >/dev/null

      - name: Build packages, daemon and mcp-server
        # build:packages includes mcp-server (its dist/ is spawned by the daemon e2e test).
        run: |
          npm run build:packages
          npm run build -w @helmstack/daemon

      - name: Run daemon + contract suites
        run: npx vitest run --project daemon --project contract
